name: m4-fix-adapter

on:
  push:
    branches: [m4/protocol-v1-1-adapter]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m4/protocol-v1-1-adapter
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96"
          components: rustfmt
      - name: Apply compiler fix
        run: python - <<'PY'
          from pathlib import Path
          path = Path('crates/asi-ai-sdk/src/protocol_v1_1.rs')
          text = path.read_text()
          text = text.replace('object.entry("error".into())', 'object.entry("error")')
          path.write_text(text)
          PY
      - name: Format and update lockfile
        run: |
          cargo fmt --all
          cargo check -p asi-ai-sdk
      - name: Commit generated fixes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "M4 Runtime Contract"
          git config user.email "134386970+ydtzfx@users.noreply.github.com"
          git add Cargo.lock crates/asi-ai-sdk/src/protocol_v1_1.rs crates/asi-ai-sdk/tests/protocol_v1_1_conformance.rs crates/asi-ai-sdk/src/lib.rs crates/asi-ai-sdk/Cargo.toml
          git commit -m "M4: format Rust adapter and update lockfile"
          git push origin HEAD:m4/protocol-v1-1-adapter
